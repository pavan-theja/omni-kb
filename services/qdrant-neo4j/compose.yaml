services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cognee-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ../../cognee/runtime/external/qdrant:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: cognee-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH:-neo4j/pleaseletmein}"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - ../../cognee/runtime/external/neo4j/data:/data
      - ../../cognee/runtime/external/neo4j/logs:/logs
    restart: unless-stopped
